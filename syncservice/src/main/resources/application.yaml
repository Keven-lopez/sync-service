server:
  port: 8081
  
sync:
  cron: "0 0 2 * * *"

spring:
  application:
    name: sync-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/aqua_gest?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:sync_ro}
    password: ${MYSQL_PASSWORD:una_clave}
    hikari:
      read-only: true
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/sync}
  data:
    mongodb:
      representation:
        big-decimal: decimal128
